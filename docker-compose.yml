services:
  vocapeek-web:
    build: .
    restart: always
    expose:
      - "3000"
    environment:
      POSTGRES_HOST: vocapeek-postgres
      POSTGRES_USER: ${POSTGRES_USER:-vocapeek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vocapeek}
    depends_on:
      vocapeek-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - dokploy-network
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vocapeek-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vocapeek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vocapeek}
    volumes:
      - vocapeek_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocapeek} -d ${POSTGRES_DB:-vocapeek}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  vocapeek_postgres_data:

networks:
  dokploy-network:
    external: true
