name: update-e2e

# Installs a released version and checks that it updates itself to the latest release.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Installed version, for example 0.1.1
        required: true
      to:
        description: Expected version after the update, for example 0.1.2
        required: true

jobs:
  mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install the old version
        run: |
          gh release download "v${{ inputs.from }}" -R "$GITHUB_REPOSITORY" -p "*-${{ inputs.from }}-mac-arm64.zip" -O old.zip
          mkdir apps && ditto -x -k old.zip apps
      - name: Update
        run: |
          mkdir data
          old=$(ls -d apps/*.app)
          CARDS_UPDATE_TEST="$PWD/data" "$old/Contents/MacOS/$(basename "$old" .app)" || true
          for i in $(seq 1 60); do
            v=""
            for a in apps/*.app; do
              [ -f "$a/Contents/Info.plist" ] && v=$(plutil -extract CFBundleShortVersionString raw "$a/Contents/Info.plist" || true)
            done
            [ "$v" = "${{ inputs.to }}" ] && break
            sleep 2
          done
          cat data/update.log
          echo "installed: $v"
          test "$v" = "${{ inputs.to }}"
      - name: Updated app still runs
        run: |
          mkdir smoke
          a=$(ls -d apps/*.app)
          echo "installed as $a"
          test -z "$(ls -d apps/*.old.* 2>/dev/null)"
          CARDS_SMOKE="$PWD/smoke" "$a/Contents/MacOS/$(basename "$a" .app)"
          cat smoke/smoke-state.json

  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the old version
        run: |
          gh release download "v${{ inputs.from }}" -R "$GITHUB_REPOSITORY" -p "*-${{ inputs.from }}-win-x64.exe" -O old.exe
          powershell -Command "Start-Process -Wait -FilePath .\old.exe -ArgumentList '/S'"
      - name: Update
        run: |
          find_app() { ls "$LOCALAPPDATA"/Programs/{Cards,Vocapeek}/{Cards,Vocapeek}.exe 2>/dev/null | head -1; }
          mkdir data
          CARDS_UPDATE_TEST="$(cygpath -w "$PWD/data")" "$(find_app)" || true
          for i in $(seq 1 60); do
            app=$(find_app)
            v=""
            [ -n "$app" ] && v=$(powershell -Command "(Get-Item '$(cygpath -w "$app")').VersionInfo.ProductVersion" | tr -d '\r' | sed 's/\.0$//' || true)
            [ "$v" = "${{ inputs.to }}" ] && break
            sleep 2
          done
          cat data/update.log
          echo "installed: $v"
          test "$v" = "${{ inputs.to }}"
      - name: Updated app still runs
        run: |
          mkdir smoke
          app=$(ls "$LOCALAPPDATA"/Programs/{Cards,Vocapeek}/{Cards,Vocapeek}.exe 2>/dev/null | head -1)
          echo "installed as $app"
          CARDS_SMOKE="$(cygpath -w "$PWD/smoke")" "$app"
          cat smoke/smoke-state.json
