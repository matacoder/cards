<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <span class="word" id="word"></span>
      <button class="speak" id="speak" title="Прослушать" aria-label="Прослушать">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="bottom"><span class="translation" id="translation"></span></div>
    <button class="learned" id="learned" title="Я выучил" aria-label="Я выучил">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress" id="progress"></div>
  </div>
  <script src="card.js"></script>
</body>
</html>
